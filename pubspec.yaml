name: nayomis_waterfront
description: Nayomi's Waterfront customer application.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cached_network_image: ^3.4.1
  connectivity_plus: ^7.2.0
  dio: ^5.10.0
  drift: ^2.34.1
  drift_flutter: ^0.3.1
  flutter_riverpod: ^3.3.2
  flutter_secure_storage: ^10.3.1
  go_router: ^17.3.0
  intl: ^0.20.3
  json_annotation: ^4.12.0
  shared_preferences: ^2.5.5
  timezone: ^0.11.1
  uuid: ^4.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.15.1
  drift_dev: ^2.34.0
  flutter_lints: ^6.0.0
  http_mock_adapter: ^0.6.1
  json_serializable: ^6.14.0
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
  default-flavor: development
  assets:
    - assets/branding/
    - assets/hero/
    - assets/gallery/full/
    - assets/gallery/thumbs/
    - assets/about/
    - assets/preorder/
